<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartHub Control</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1.25rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.15rem; }
  h2 { font-size: 0.95rem; margin: 0 0 0.6rem; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .sub { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }

  .statusbar { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; align-items: center;
               padding: 0.6rem 1rem; border-radius: 10px; background: #6663; margin-bottom: 1.25rem; font-size: 0.85rem; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .ok { background: #2ecc71; } .bad { background: #e74c3c; } .unk { background: #999; }

  .hero { width: 100%; font-size: 1.15rem; font-weight: 700; padding: 1.4rem; border-radius: 14px;
          border: none; cursor: pointer; background: #2ecc71; color: #04342c; margin-bottom: 0.75rem; }
  .hero:active { transform: scale(0.99); }
  .hero:disabled { opacity: 0.6; cursor: not-allowed; }
  .hero .hint { display: block; font-size: 0.78rem; font-weight: 400; margin-top: 0.2rem; color: #04342c; opacity: 0.75; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
  button.secondary { font-size: 0.92rem; padding: 0.8rem; border-radius: 10px; border: 1px solid #8883; cursor: pointer; background: #6663; }
  button.secondary:active { transform: scale(0.98); }
  button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }

  .srcpick { display: flex; align-items: center; gap: 8px; margin: 0 0 0.75rem; font-size: 0.82rem; color: #999; }
  .srcpick select { font-size: 0.82rem; padding: 0.3rem 0.5rem; border-radius: 8px;
                    border: 1px solid #8883; background: #6663; color: inherit; }

  .banner { padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }
  .banner.show { display: block; }
  .banner.success { background: #2ecc7122; color: #2ecc71; border: 1px solid #2ecc7155; }
  .banner.error { background: #e74c3c22; color: #e74c3c; border: 1px solid #e74c3c55; }
  .banner.info { background: #6663; color: inherit; }

  table.dash { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 0.4rem; }
  table.dash th, table.dash td { text-align: right; padding: 0.4rem 0.5rem; }
  table.dash th:first-child, table.dash td:first-child { text-align: left; }
  table.dash thead th { color: #999; font-weight: 600; border-bottom: 1px solid #8884; }
  table.dash tbody tr:last-child { font-weight: 700; border-top: 1px solid #8884; }
  table.dash td.warn { color: #f1c40f; }
  table.dash td.acct { color: #999; font-size: 0.8rem; }
  table.dash tr.subtotal { color: #aaa; font-style: italic; }
  table.dash tr.subtotal td { border-bottom: 1px solid #8883; }
  .dash-note { font-size: 0.75rem; color: #888; margin: 0 0 1.5rem; }
  .dash-empty { font-size: 0.85rem; color: #888; padding: 0.5rem 0 1.5rem; }

  details.advanced { margin-top: 0.5rem; }
  details.advanced summary { cursor: pointer; font-size: 0.85rem; color: #999; padding: 0.4rem 0; user-select: none; }
  details.advanced .row { margin-top: 0.75rem; margin-bottom: 0.75rem; }

  #log { background: #1118; color: #ddd; font-family: ui-monospace, monospace; font-size: 0.76rem;
         padding: 0.75rem; border-radius: 10px; height: 220px; overflow-y: auto; white-space: pre-wrap; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>SmartHub Control</h1>
  <div class="sub" id="hostinfo">loading…</div>

  <div class="statusbar" id="status">Loading status…</div>
  <div class="banner" id="banner"></div>

  <button class="hero" id="btn-hero">
    <span id="hero-label">Print New Labels</span>
    <span class="hint" id="hero-hint">Combines every new label into one PDF per marketplace (+ pick list)</span>
  </button>

  <div class="srcpick hub-only" id="row-source">
    <label for="sel-source">Print from</label>
    <select id="sel-source"><option value="all">All machines</option></select>
  </div>

  <div class="row hub-only" id="row-print-secondary">
    <button class="secondary" id="btn-print-all">Print All Today's Labels</button>
    <button class="secondary" id="btn-reprint">Reprint Last Labels</button>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <h2 style="margin-bottom:0;">Today's status</h2>
    <button class="secondary" id="btn-summary" style="padding:0.3rem 0.7rem; font-size:0.8rem; margin-bottom:0.6rem;">Refresh</button>
  </div>
  <div id="dash-wrap">
    <div class="dash-empty">Loading…</div>
  </div>

  <details class="advanced">
    <summary id="advanced-summary">Advanced (processing runs automatically every 15 min — manual controls below)</summary>
    <div class="row hub-only" id="row-advanced-hub">
      <button class="secondary" id="btn-run">Process Orders Now</button>
      <button class="secondary" id="btn-login">Login</button>
    </div>
    <div class="row processor-only" id="row-advanced-processor" style="display:none;">
      <button class="secondary" id="btn-print-local">Print Locally (fallback)</button>
      <button class="secondary" id="btn-print-all-local">Print All (local)</button>
    </div>
    <div class="row processor-only" id="row-advanced-processor2" style="display:none;">
      <button class="secondary" id="btn-reprint-local">Reprint Last (local)</button>
      <button class="secondary" id="btn-login-2">Login</button>
    </div>
    <h2>Activity log</h2>
    <div id="log"></div>
  </details>

<script>
const $ = (id) => document.getElementById(id);
let bannerTimer = null;

function setBanner(text, kind) {
  const el = $("banner");
  el.textContent = text;
  el.className = "banner show " + kind;
  clearTimeout(bannerTimer);
  if (kind !== "info") bannerTimer = setTimeout(() => el.classList.remove("show"), 8000);
}

// Renders a combined table across machines. `sources` = [{name, rows}], so a hub
// shows both its own account and each peer's; a lone processor shows just itself.
function renderDash(sources) {
  const wrap = $("dash-wrap");
  const withRows = (sources || []).filter((s) => s.rows && s.rows.length);
  if (!withRows.length) { wrap.innerHTML = '<div class="dash-empty">No data yet — click Refresh, or wait for the next 15-min cycle.</div>'; return; }

  const multi = withRows.length > 1;
  const zero = { total: 0, processed: 0, waiting: 0, printed: 0, cancelled: 0 };
  const grand = { ...zero };
  let body = "";

  const cells = (r) => `<td>${r.total}</td><td>${r.processed}</td>` +
    `<td${r.waiting > 0 ? ' class="warn"' : ""}>${r.waiting}</td><td>${r.printed}</td><td>${r.cancelled}</td>`;

  for (const s of withRows) {
    const sub = s.rows.reduce((a, r) => ({
      total: a.total + r.total, processed: a.processed + r.processed, waiting: a.waiting + r.waiting,
      printed: a.printed + r.printed, cancelled: a.cancelled + r.cancelled }), { ...zero });
    for (const k of Object.keys(grand)) grand[k] += sub[k];
    for (const r of s.rows) {
      body += `<tr>${multi ? `<td class="acct">${s.name}</td>` : ""}<td>${r.key}</td>${cells(r)}</tr>`;
    }
    if (multi) body += `<tr class="subtotal"><td class="acct">${s.name}</td><td>subtotal</td>${cells(sub)}</tr>`;
  }
  body += `<tr>${multi ? "<td></td>" : ""}<td>TOTAL</td>${cells(grand)}</tr>`;

  wrap.innerHTML =
    '<table class="dash"><thead><tr>' + (multi ? "<th>Account</th>" : "") +
    '<th>Channel</th><th>Total</th><th>Processed</th><th>Waiting</th><th>Printed</th><th>Cancelled</th></tr></thead><tbody>' +
    body +
    '</tbody></table><div class="dash-note">Processed = packed/shipped in SmartHub &middot; Waiting = not yet packed &middot; Printed = labels printed</div>';
}

async function post(path, { silent, body } = {}) {
  clearLogView();
  if (!silent) setBanner("Working…", "info");
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const opts = { method: "POST" };
    if (body) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    if (!silent) setBanner(j.message || "Done.", j.warnings && j.warnings.length ? "info" : "success");
  } catch (e) {
    setBanner("Error: " + e.message, "error");
  }
  document.querySelectorAll("button").forEach((b) => (b.disabled = false));
  refreshStatus();
}

function loginHandler() {
  setBanner("Opening a visible login window on the server machine — complete OTP there.", "info");
  post("/api/login", { silent: true });
}

$("btn-print-all").onclick = () => post("/api/print-all");
$("btn-reprint").onclick = () => post("/api/reprint");
$("btn-run").onclick = () => post("/api/run");
$("btn-login").onclick = loginHandler;
$("btn-login-2").onclick = loginHandler;
$("btn-print-local").onclick = () => post("/api/print");
$("btn-print-all-local").onclick = () => post("/api/print-all");
$("btn-reprint-local").onclick = () => post("/api/reprint");
$("btn-summary").onclick = () => post("/api/summary");

// Role decides the hero action + which secondary controls show:
// - "hub" (has peers configured, e.g. Shop PC with the printer): hero = Print
//   New Labels, pulling + merging from every configured peer machine too.
// - "processor" (e.g. Bludo PC, no printer): hero = Process Orders Now; local
//   printing stays available as a fallback, tucked into Advanced.
let roleApplied = null;
let pendingTotal = 0;

function applyRole(role) {
  const hero = $("btn-hero");
  if (role === "hub") {
    // Show what's actually waiting, so the employee knows before clicking.
    $("hero-label").textContent = pendingTotal > 0 ? `Print New Labels (${pendingTotal} waiting)` : "Print New Labels";
    if (role !== roleApplied) {
      $("hero-hint").textContent = "Combines new labels from all machines into one PDF per marketplace (+ pick list)";
      hero.onclick = () => post("/api/print-combined", { body: { source: $("sel-source").value } });
      $("row-source").style.display = "";
      $("row-print-secondary").style.display = "";
      $("row-advanced-hub").style.display = "";
      $("row-advanced-processor").style.display = "none";
      $("row-advanced-processor2").style.display = "none";
    }
  } else {
    $("hero-label").textContent = "Process Orders Now";
    if (role !== roleApplied) {
      $("hero-hint").textContent = "Also runs automatically every 15 min — click to run immediately";
      hero.onclick = () => post("/api/run");
      $("row-source").style.display = "none";
      $("row-print-secondary").style.display = "none";
      $("row-advanced-hub").style.display = "none";
      $("row-advanced-processor").style.display = "";
      $("row-advanced-processor2").style.display = "";
    }
  }
  roleApplied = role;
}

async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    const selfLabel = j.name || j.host;
    const peers = j.peers || [];

    // Machines row: this machine + every peer, each with its own health dot.
    const machineChip = (name, ok, extra) =>
      `<span><span class="dot ${ok === true ? "ok" : ok === false ? "bad" : "unk"}"></span>${name}${extra || ""}</span>`;
    const machinesHtml =
      machineChip(selfLabel, j.sessionAlive, j.sessionAlive === false ? " (login needed)" : "") +
      peers.map((p) => machineChip(p.name, p.online, p.online ? "" : " (unreachable)")).join("");

    const queueText = j.queue.busy ? `running: ${j.queue.current.name}` : "idle";
    $("status").innerHTML =
      machinesHtml +
      `<span>Queue: ${queueText}</span>` +
      (j.lastCycleAt ? `<span>Last cycle: ${new Date(j.lastCycleAt).toLocaleTimeString()}</span>` : "<span>Last cycle: none yet</span>");
    $("hostinfo").textContent = `${selfLabel} · ${j.date} · auto-processing every 15 min`;

    // Combined status across this machine + peers.
    renderDash([{ name: selfLabel, rows: j.lastSummary }, ...peers.map((p) => ({ name: p.name, rows: p.summary }))]);

    // Waiting-to-print count, on the hero button itself.
    const localPending = j.pending || 0;
    const peerPending = peers.reduce((s, p) => s + (p.pending || 0), 0);
    pendingTotal = j.role === "hub" ? localPending + peerPending : localPending;

    // Keep the source dropdown in sync with the known machines.
    const sel = $("sel-source");
    const wanted = ["all", "local", ...peers.map((p) => p.name)].join(",");
    if (sel.dataset.built !== wanted) {
      sel.dataset.built = wanted;
      const prev = sel.value;
      sel.innerHTML =
        `<option value="all">All machines</option><option value="local">${selfLabel} only</option>` +
        peers.map((p) => `<option value="${p.name}">${p.name} only</option>`).join("");
      if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    }

    applyRole(j.role);
  } catch (e) {
    $("status").textContent = "Could not reach server.";
  }
}

let lastLogLines = [];
let logBaseline = 0;
function clearLogView() {
  logBaseline = lastLogLines.length;
  $("log").textContent = "";
}
async function refreshLog() {
  try {
    const r = await fetch("/api/log");
    const lines = await r.json();
    lastLogLines = lines;
    const visible = lines.slice(logBaseline);
    const el = $("log");
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    el.textContent = visible.join("\n");
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch {}
}

refreshStatus();
refreshLog();
setInterval(refreshStatus, 5000);
setInterval(refreshLog, 3000);

// Fetch a real status table once on load if nothing's cached yet, instead of
// leaving "Today's status" stuck on "Loading..." until someone clicks Refresh.
(async () => {
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    if (!j.lastSummary) post("/api/summary", { silent: true });
  } catch {}
})();
</script>
</body>
</html>
